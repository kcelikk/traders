# MAKİNE TESTİ config'i — strateji DEĞİL. Faz 3'te maliyet üstü beklenti gösteren hücre yoktur (0/48);
# buradaki hücreler yalnızca paper yığınını (karar→risk→emir→koruma→çıkış) uçtan uca koşturmak içindir.
# Bu config ile üretilen sonuçlar kârlılık kanıtı değildir (ADR 0010).
#
# fbot paper trading — Faz 7. Kayıt ayarları recorder.toml ile aynı şemadır; ek olarak çekirdek/karar/risk parametreleri.
# Kârlılık gösterilmedi (ADR 0010): [decision].allowed_cells boş olduğu sürece hiçbir giriş emri üretilmez.

[run]
out_dir = "data/recordings"
rotate_minutes = 60
snapshot_interval_s = 600
depth_snapshot_limit = 1000
stats_interval_s = 10
tick_ms = 1000

[universe]
mode = "top"
top_n = 10
exclude_bases = ["USDC", "FDUSD", "TUSD", "BUSD", "USD1", "USDE", "USDP", "DAI"]

[streams]
public = ["{s}@bookTicker", "{s}@depth@100ms"]
market = ["{s}@aggTrade", "{s}@markPrice@1s", "{s}@forceOrder"]

[staleness_s]
public = 30
market = 30

[reconnect]
backoff_initial_s = 1.0
backoff_max_s = 30.0

[core]
bar_ms = 60000

[state_engine]                 # Faz 3 ile aynı; ısınma 2W bar (W=240 → 8 saat)
W = 30
N_short = 5
N_long = 15
p_lo = 0.2
p_hi = 0.8

[decision]
notional_usdt = "80"           # ADR 0004
max_state_age_bars = 3
spread_mult = "2"
funding_guard_ms = 120000
report_hash = "a693aa0742076410"
allowed_cells = [{ state = "S1", dir = "long", h = 15 }, { state = "S2", dir = "short", h = 15 }, { state = "S3", dir = "long", h = 5 }, { state = "S3", dir = "short", h = 5 }]             # Faz 3'te maliyet üstü beklenti gösteren hücre yok → giriş yok
# örnek: allowed_cells = [{ state = "S1", dir = "long", h = 15 }]
sl_pct = { S1 = "0.5", S2 = "0.5", S3 = "0.4", S4 = "0.6" }   # ÖLÇÜLMEDİ — makine testi değeri
tp_pct = { S1 = "1.0", S2 = "1.0", S3 = "0.8", S4 = "1.2" }   # ÖLÇÜLMEDİ — makine testi değeri
research_spread_bps = { BNBUSDT = "0.14", BTCUSDT = "0.013", DOGEUSDT = "1.192", ETHUSDT = "0.041", HYPEUSDT = "0.125", IOSTUSDT = "2.031", NEARUSDT = "0.5", SOLUSDT = "1.004", VTHOUSDT = "3.385", XRPUSDT = "0.742", ZECUSDT = "0.091" }   # ölçüldü: rec-72h son 3 saat, bookTicker medyanı (NEAR evrende değildi, tahmin)

[position]                     # ADR 0012
t_protect_ms = 3000
t_backup_ms = 1500
working_type = "MARK_PRICE"
price_protect = true
min_replace_interval_ms = 5000
taker_fee_pct = "0.05"         # VIP0, doğrulanmadı (docs/unit-economics.md)
maker_fee_pct = "0.02"
max_hold_ms = 3600000
lock_trigger_pct = "0.30"
lock_offset_pct = "0.05"
trail_step_pct = "0.10"
trail_gap_pct = "0.30"
degrade_map = { S1 = ["S2"], S2 = ["S1"] }
# tp1_pct / tp1_frac: ölçülmedi → kapalı

[risk]
max_positions = 5
gross_cap_usdt = "400"
default_leverage = 5
leverage = { BTCUSDT = 10, ETHUSDT = 10 }
margin_buffer = "0.2"
spread_max_bps = "5"
reserve_orders = 3
backoff_ms = 10000
warmup_bars = 60              # 2W
beta_cap_usdt = "750"          # ADR 0014: 30 günlük beta ölçümü (docs/research/beta-dagilimi.md)
# cooldown_*, participation_max, slippage_max_bps: ölçülmedi → kapalı

[sim]
latency_ms = 400
jitter_ms = 600
seed = 20260910
partial_timeout_ms = 5000
prob_fill_on_touch = 0.0
book_levels = 20

[account]                      # paper: sanal hesap; borsa yok → kaldıraç görünümü config'in kendisi
paper = true
available_balance = "1000"
